spring.application.name=oficina-app

# Credentials come from the environment or from the repo-root .env file
# (shared with docker-compose, gitignored). No secret lives in this file.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:oficina_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Keeps validation messages in English, matching the rest of the API contract.
# The mobile app is responsible for showing them in the user's language.
spring.web.locale=en
spring.web.locale-resolver=fixed

# An unexpected failure answers the same ApiError shape as everything else;
# stack traces belong in the log, not in the response.
server.error.include-stacktrace=never
server.error.include-message=never

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Development-only secret. Override with the JWT_SECRET environment variable outside local runs.
security.jwt.secret=${JWT_SECRET:local-development-secret-change-me-before-any-deploy}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
security.jwt.issuer=oficina-na-nuvem

integration.fipe.base-url=${FIPE_BASE_URL:https://parallelum.com.br/fipe/api/v1}
