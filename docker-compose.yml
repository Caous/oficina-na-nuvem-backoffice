services:
  postgres:
    image: postgres:17-alpine
    container_name: oficina-postgres
    restart: unless-stopped
    environment:
      # Values come from the .env file next to this compose file — copy
      # .env.example to .env before the first run. Nothing is committed.
      POSTGRES_DB: ${DB_NAME:?copy .env.example to .env and set DB_NAME}
      POSTGRES_USER: ${DB_USER:?copy .env.example to .env and set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?copy .env.example to .env and set DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - oficina-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oficina-postgres-data:
